<div class="login-domain">nexo.academia.br</div>

<div class="login-card">
    <div class="login-logo">
        <div class="logo-icon">
            <img alt="Logo NEXO" src="/public/images/logo.jpg" class="login-logo-image" />
        </div>
        <div class="logo-text">NEX<span>O</span></div>
    </div>

    <p class="login-subtitle">Onde o conhecimento se conecta.</p>

    <div class="login-tabs">
        <div class="login-tab active" data-login-tab="login">Entrar</div>
        <div class="login-tab" data-login-tab="register">Cadastrar</div>
    </div>
<!-- Login -->
<div id="login-panel">
    <div class="form-group">
        <label class="form-label">E-mail</label>
        <input class="form-input" placeholder="E-mail*" type="email" />
    </div>
    <div class="form-group">
        <label class="form-label">Senha</label>
        <input class="form-input" placeholder="••••••••" type="password" />
    </div>
    <button class="btn btn-primary" data-action="go-to-app"><i class="ti ti-arrow-right"></i> Entrar na
        plataforma</button>
</div>

<!-- Register -->
    <div id="register-panel" class="register-panel is-hidden">
        
        <div class="grid-2 login-name-grid">
            <div class="form-group login-name-field"><label class="form-label">Nome</label>
                <input class="form-input" placeholder="Seu nome" />
            </div>
            
            <div class="form-group login-name-field"><label class="form-label">Sobrenome</label>
                <input class="form-input" placeholder="Sobrenome" />
            </div>
        </div>

        <div class="form-group"><label class="form-label">E-mail</label>
            <input class="form-input" placeholder="E-mail*" type="email" />
        </div>
        
        <div class="form-group"><label class="form-label">Instituição</label>
            <input class="form-input" placeholder="Ex: UNIFEI, USP, UFMG..." />
        </div>
        
        <div class="form-group"><label class="form-label">Curso</label>
            <input class="form-input" placeholder="Ex: Ciência da Computação" />
        </div>
        
        <div class="form-group"><label class="form-label">Senha</label>
            <input class="form-input" placeholder="Mínimo 8 caracteres" type="password" />
        </div>

        <button class="btn btn-primary" data-action="go-to-app"><i class="ti ti-user-plus"></i> Criar conta NEXO</button>
    </div>
</div>

<div class="login-footer">
        Plataforma de integração acadêmica • NEXO © 2026
    </div>
