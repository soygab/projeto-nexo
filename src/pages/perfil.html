<div class="page-panel active" id="page-profile">
    <div class="card mb-20">
        <div class="profile-cover">
            <div class="profile-cover-pattern"></div>
        </div>
        <div class="profile-info">
            
            <div class="perfil-row-001">
                <div class="profile-avatar-wrap">
                    <div class="avatar avatar-xl perfil-element-002"></div>
                    <div class="perfil-status-indicator"></div>
                </div>
                <div class="perfil-element-004">
                    <div class="perfil-profile-name"></div>
                    <div class="perfil-element-006"></div>
                    <div class="perfil-row-007"></div>
                </div>
                <div class="profile-actions">
                    <button type="button" class="btn btn-primary perfil-action-009" id="profile-edit-button" data-action="edit-profile" aria-expanded="false" aria-controls="profile-editor"><i class="ti ti-settings"></i> Editar
                        Perfil</button>
                </div>
            </div>
            
            <p class="perfil-description-010"></p>
            
            <div class="perfil-row-011">
                <div class="stat-box">
                    <div class="stat-num" data-profile-stat="projects">0</div>
                    <div class="stat-label">Projetos</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" data-profile-stat="followers">0</div>
                    <div class="stat-label">Seguidores</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" data-profile-stat="following">0</div>
                    <div class="stat-label">Seguindo</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" data-profile-stat="contributions">0</div>
                    <div class="stat-label">Contribuições</div>
                </div>
            </div>
            
            <div class="perfil-row-012" id="profile-interests"></div>
        </div>
    </div>

    <div class="grid-2 perfil-element-013">
      <section>
        <div class="tabs" aria-label="Atividade do perfil">
          <button type="button" class="tab active" data-profile-tab="projects">Projetos (0)</button>
          <button type="button" class="tab" data-profile-tab="contributions">Contribuições (0)</button>
          <button type="button" class="tab" data-profile-tab="badges">Badges (0)</button>
        </div>
        <div class="card profile-empty" id="profile-activity" role="status">Nenhum projeto cadastrado ainda.</div>
      </section>
      <section>
        <div class="card-title perfil-element-020">Badges &amp; Conquistas</div>
        <div class="card profile-empty">Você ainda não possui conquistas.</div>
      </section>
    </div>
    <p id="profile-save-status" role="status" aria-live="polite"></p>
  <section class="card profile-editor is-hidden" id="profile-editor" aria-labelledby="profile-editor-title">
    <h2 id="profile-editor-title">Personalize seu perfil</h2>
    <p>Apresente sua trajetória e os assuntos em que gostaria de colaborar.</p>
    <form id="profile-form">
      <div class="grid-2">
        <label class="form-group">Nome<input class="form-input" name="first_name" required maxlength="150" autocomplete="given-name"></label>
        <label class="form-group">Sobrenome<input class="form-input" name="last_name" maxlength="150" autocomplete="family-name"></label>
        <label class="form-group">Instituição<input class="form-input" name="instituicao" required maxlength="150"></label>
        <label class="form-group">Curso<input class="form-input" name="curso" required maxlength="150"></label>
      </div>
      <label class="form-group">Sobre você<textarea class="form-input" name="bio" rows="4" maxlength="500" placeholder="Sua trajetória, projetos e objetivos"></textarea></label>
      <label class="form-group">Interesses<input class="form-input" name="interests" maxlength="250" placeholder="Ex.: Python, design, sustentabilidade"></label>
      <p id="profile-message" role="status" aria-live="polite"></p>
      <div class="profile-editor-actions">
        <button type="button" class="btn btn-secondary" data-action="cancel-profile">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar perfil</button>
      </div>
    </form>
  </section>
</div>
